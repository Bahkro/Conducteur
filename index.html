<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conducteur - Association Les Feux Follets</title>
  <!-- Google Fonts: Roboto & Roboto Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #da8f24;
      --primary-dark: #b87318;
      --primary-light: #fdf6ec;
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border-top: 6px solid var(--primary);
    }

    /* Headings with Roboto Condensed Bold */
    h1, h2, h3, th {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 15px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--text);
    }

    .brand-badge {
      background-color: var(--primary);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .header-controls {
      display: flex;
      gap: 25px;
      align-items: center;
      margin-bottom: 25px;
      padding: 18px;
      background: var(--primary-light);
      border-radius: 8px;
      border: 1px solid rgba(218, 143, 36, 0.2);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text);
    }

    input[type="time"], input[type="number"], input[type="text"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="time"]:focus, input[type="number"]:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(218, 143, 36, 0.2);
    }

    .end-time-box {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-dark);
      background: white;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      background: var(--primary);
      color: white;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.95rem;
    }

    th:first-child { border-top-left-radius: 6px; }
    th:last-child { border-top-right-radius: 6px; }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:hover {
      background-color: #fdfbf7;
    }

    .time-col {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-dark);
      width: 100px;
    }

    .duration-col {
      width: 100px;
    }

    .btn {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      padding: 6px 10px;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-secondary {
      background: #64748b;
      color: white;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-icon {
      background: #f1f5f9;
      color: var(--text);
      padding: 6px 10px;
      border: 1px solid var(--border);
    }

    .btn-icon:hover {
      background: #e2e8f0;
    }

    .actions-cell {
      display: flex;
      gap: 4px;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    /* Modern Print Styling */
    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
        border-top: none;
      }

      .header-controls, .actions-bar, .btn-action-col, .actions-cell {
        display: none !important;
      }

      .brand-badge {
        background-color: transparent;
        color: var(--text);
        border: 1px solid var(--primary);
      }

      th {
        background-color: var(--primary) !important;
        color: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      input {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
      }

      .end-time-box {
        border: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-title">
    <h1>Conducteur d'Événement — AG 2026</h1>
    <div class="brand-badge">Les Feux Follets</div>
  </div>
  
  <div class="header-controls">
    <div class="control-group">
      <label for="startTime">Heure de démarrage :</label>
      <input type="time" id="startTime" value="09:00" onchange="recalculateTiming()">
    </div>
    <div class="control-group">
      <label>Fin estimée :</label>
      <div id="endTimeDisplay" class="end-time-box">--:--</div>
    </div>
  </div>

  <table id="scheduleTable">
    <thead>
      <tr>
        <th>Heure</th>
        <th>Durée (min)</th>
        <th>Thème / Sujet</th>
        <th>Intervenants</th>
        <th class="btn-action-col" style="width: 110px;">Actions</th>
      </tr>
    </thead>
    <tbody id="scheduleBody"></tbody>
  </table>

  <div class="actions-bar">
    <button class="btn btn-primary" onclick="addRow()">+ Ajouter une séquence</button>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-secondary" onclick="exportCSV()">Exporter CSV</button>
      <button class="btn btn-primary" onclick="window.print()">Imprimer / PDF</button>
    </div>
  </div>
</div>

<script>
  // Initial dataset populated from the provided Excel structure
  let items = [
    { duration: 5, theme: "Accueil", speaker: "Loïc" },
    { duration: 5, theme: "Appel des signatures", speaker: "Loïc" },
    { duration: 10, theme: "Introduction", speaker: "Loïc" },
    { duration: 10, theme: "Rapport moral", speaker: "Loïc & Perrine" },
    { duration: 5, theme: "Questions - Réponses", speaker: "Loïc & Sylvain" },
    { duration: 30, theme: "La phénylcétonurie et les recommandations européennes 2025", speaker: "Pr. Labarthe" },
    { duration: 5, theme: "Questions - Réponses", speaker: "" },
    { duration: 30, theme: "La recherche clinique à Tours", speaker: "Pr Maillot & Yann Dos Santos" },
    { duration: 5, theme: "Questions - Réponses", speaker: "" },
    { duration: 10, theme: "Rapport d'activités", speaker: "Loïc & Sylvain" },
    { duration: 10, theme: "Conseil des jeunes", speaker: "Charlène" }
  ];

  function render() {
    const tbody = document.getElementById('scheduleBody');
    tbody.innerHTML = '';
    
    items.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="time-col" id="time-${index}">--:--</td>
        <td class="duration-col">
          <input type="number" value="${item.duration}" min="1" style="width: 70px;" onchange="updateDuration(${index}, this.value)">
        </td>
        <td>
          <input type="text" value="${item.theme}" style="width: 98%;" onchange="updateText(${index}, 'theme', this.value)">
        </td>
        <td>
          <input type="text" value="${item.speaker}" style="width: 98%;" onchange="updateText(${index}, 'speaker', this.value)">
        </td>
        <td class="actions-cell btn-action-col">
          <button class="btn btn-icon" title="Monter" onclick="moveRow(${index}, -1)">▲</button>
          <button class="btn btn-icon" title="Descendre" onclick="moveRow(${index}, 1)">▼</button>
          <button class="btn btn-danger" title="Supprimer" onclick="deleteRow(${index})">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    recalculateTiming();
  }

  function recalculateTiming() {
    const startInput = document.getElementById('startTime').value;
    if (!startInput) return;

    let [hours, minutes] = startInput.split(':').map(Number);
    let currentMinutes = hours * 60 + minutes;

    items.forEach((item, index) => {
      const h = Math.floor(currentMinutes / 60) % 24;
      const m = currentMinutes % 60;
      const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      
      const timeCell = document.getElementById(`time-${index}`);
      if (timeCell) timeCell.innerText = timeStr;

      currentMinutes += parseInt(item.duration || 0, 10);
    });

    const endH = Math.floor(currentMinutes / 60) % 24;
    const endM = currentMinutes % 60;
    document.getElementById('endTimeDisplay').innerText = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
  }

  function updateDuration(index, val) {
    items[index].duration = parseInt(val, 10) || 0;
    recalculateTiming();
  }

  function updateText(index, field, val) {
    items[index][field] = val;
  }

  function addRow() {
    items.push({ duration: 10, theme: "Nouvelle séquence", speaker: "" });
    render();
  }

  function deleteRow(index) {
    items.splice(index, 1);
    render();
  }

  function moveRow(index, direction) {
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= items.length) return;
    const temp = items[index];
    items[index] = items[newIndex];
    items[newIndex] = temp;
    render();
  }

  function exportCSV() {
    let csv = "Heure;Duree (min);Theme;Intervenant\n";
    let startInput = document.getElementById('startTime').value;
    let [hours, minutes] = startInput.split(':').map(Number);
    let currentMinutes = hours * 60 + minutes;

    items.forEach(item => {
      const h = Math.floor(currentMinutes / 60) % 24;
      const m = currentMinutes % 60;
      const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      csv += `"${timeStr}";"${item.duration}";"${item.theme.replace(/"/g, '""')}";"${item.speaker.replace(/"/g, '""')}"\n`;
      currentMinutes += parseInt(item.duration || 0, 10);
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "conducteur_ag_feux_follets.csv";
    link.click();
  }

  // Initial rendering
  render();
</script>

</body>
</html>
